server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 26m;   # backend 25MB fayl qabul qiladi

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;

    # ---------- backend ----------
    location /api/ {
        proxy_pass http://olima-api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/v1/chat/stream): buferlash o'chirilmasa javob oqmaydi
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection '';
        chunked_transfer_encoding off;

        # model javobi uzoq davom etishi mumkin
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 15s;
    }

    location /actuator/ {
        proxy_pass http://olima-api:8080;
        proxy_set_header Host $host;
    }

    # ---------- widget ----------
    # widget.js o'z manzilidan base yasaydi (.../widget.js -> .../app.html),
    # shuning uchun bu fayllar aynan ildizda turishi shart.
    # Mijoz saytlari widget.js ni to'g'ridan-to'g'ri yuklaydi — kesh sarlavhasiz brauzer eski
    # versiyani o'zicha ushlab qoladi va yangilanish ko'rinmaydi. no-cache = har safar ETag bilan
    # tekshirish (o'zgarmagan bo'lsa 304, trafik deyarli yo'q).
    location = /widget.js    { alias /usr/share/nginx/html/w/widget.js; add_header Cache-Control "no-cache"; }
    location = /app.html     { alias /usr/share/nginx/html/w/app.html;  add_header Cache-Control "no-cache"; }
    location = /logo-96.png  { alias /usr/share/nginx/html/w/logo-96.png; }
    location = /logo-256.png { alias /usr/share/nginx/html/w/logo-256.png; }

    # ---------- landing ----------
    # alias'ni to'g'ridan-to'g'ri faylga qaratish nginx'da 500 beradi —
    # root + try_files ishonchli yo'l.
    location = /demo { return 301 /demo/; }
    location = /demo/ {
        root /usr/share/nginx/html/w;
        try_files /index.html =404;
    }

    # ---------- admin panel (Angular SPA) ----------
    #
    # index.html HECH QACHON keshlanmasligi kerak. Angular chunk nomlarini xeshlaydi,
    # ya'ni yangi build = yangi fayl nomlari. Lekin bu nomlar index.html ichida yozilgan —
    # agar brauzer eski index.html ni ushlab qolsa, u eski chunk'larni so'rab, yangilanish
    # umuman ko'rinmaydi. Cache-Control bo'lmasa brauzer Last-Modified bo'yicha o'zi
    # keshlaydi va aynan shunday bo'ldi.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Xeshlangan fayllar — nomi o'zgargani uchun uzoq keshlash xavfsiz.
    location ~* ^/(chunk|main|polyfills|styles)-[A-Z0-9]+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Yo'q JS/CSS fayl uchun index.html qaytarmaymiz: eski tab chunk so'rasa aniq 404 olsin
    # (aks holda HTML "JS" bo'lib keladi va xato tushunarsiz bo'ladi).
    location ~* \.(?:js|css|map)$ {
        try_files $uri =404;
    }
}
