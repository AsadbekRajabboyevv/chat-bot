# OLIMA AI — serverdagi ishga tushirish
#
# MUHIM: bu server MT (vtest.uz) prodini ham ko'taradi. Shuning uchun:
#  - alohida Postgres (MT ning bazasiga umuman tegilmaydi)
#  - har bir konteynerga xotira chegarasi (MT ni ochlikda qoldirmaslik uchun)
#  - tashqariga faqat BITTA port chiqadi: ${OLIMA_PORT}
#
# Serverda repo /opt/olima/src ga clone qilingan, .env esa /opt/olima/.env da
# (git'ga tushmaydi). Qo'lda ishga tushirish:
#   docker compose --env-file /opt/olima/.env -f /opt/olima/src/deploy/docker-compose.yml up -d --build
# Odatda buni deploy/autodeploy.sh qiladi — prod branch'ga push bo'lganda.
#
# Tashqi kirish: http://<server-ip>:${OLIMA_PORT}
#   /           -> admin panel (Angular)
#   /demo       -> landing sahifa
#   /widget.js  -> mijoz saytiga qo'yiladigan skript
#   /api/**     -> olima-api

name: olima

services:
  olima-postgres:
    image: postgres:16-alpine
    container_name: olima-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: olima
    volumes:
      - olima-pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d olima"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 320M
    networks: [olima]

  # Nomi ataylab "mock-government": tool'lar bazada shu host nomi bilan yozilgan.
  mock-government:
    image: olima/mockgov:latest
    build:
      context: ..
      dockerfile: deploy/mockgov/Dockerfile
    container_name: mock-government
    restart: unless-stopped
    environment:
      DB_HOST: olima-postgres
      DB_PORT: 5432
      DB_NAME: mock_government
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -Xss512k"
    depends_on:
      olima-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 420M
    networks: [olima]

  olima-api:
    image: olima/api:latest
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    container_name: olima-api
    restart: unless-stopped
    environment:
      DB_HOST: olima-postgres
      DB_PORT: 5432
      DB_NAME: olima
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY:-}
      GOOGLE_SEARCH_CX: ${GOOGLE_SEARCH_CX:-}
      JWT_SECRET: ${JWT_SECRET}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-super}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -Xss512k"
    depends_on:
      olima-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1100M
    networks: [olima]

  olima-web:
    image: olima/web:latest
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    container_name: olima-web
    restart: unless-stopped
    ports:
      - "${OLIMA_PORT:-8095}:80"
    depends_on:
      - olima-api
    deploy:
      resources:
        limits:
          memory: 96M
    # Faqat nginx ikkala tarmoqda: ptcenter_default orqali Caddy uni nom bilan
    # topadi va HTTPS beradi. olima-api, mock-government va baza o'sha tarmoqqa
    # chiqmaydi — ular faqat olima_net da qoladi.
    networks: [olima, proxy]

volumes:
  olima-pgdata:

networks:
  olima:
    name: olima_net
  proxy:
    name: ptcenter_default
    external: true
