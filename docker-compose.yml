services:
  postgres:
    image: postgres:16-alpine
    container_name: olima-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: olima
      POSTGRES_PASSWORD: olima
      POSTGRES_DB: olima
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olima"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-government:
    build:
      context: ./mock-government
      dockerfile: Dockerfile
    container_name: olima-mock-government
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mock_government
      DB_USERNAME: olima
      DB_PASSWORD: olima
    depends_on:
      postgres:
        condition: service_healthy

  olima-backend:
    build:
      context: ./olima-backend
      dockerfile: Dockerfile
    container_name: olima-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: olima
      DB_USERNAME: olima
      DB_PASSWORD: olima
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MOCK_GOVERNMENT_BASE_URL: http://mock-government:8081
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      mock-government:
        condition: service_started

  olima-frontend:
    build:
      context: ./olima-frontend
      dockerfile: Dockerfile
    container_name: olima-frontend
    ports:
      - "4200:80"
    depends_on:
      - olima-backend

volumes:
  postgres-data:
