spring:
  application:
    name: olima-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:olima}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.3

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-this-dev-only-secret-key-please-override-in-prod-0123456789}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  # Vergul bilan ajratilgan origin naqshlari. Serverda CORS_ORIGINS orqali
  # o'zgartiriladi — yangi domen uchun qayta yig'ish shart emas.
  cors:
    allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://172.16.*.*:*,http://192.168.*.*:*,http://10.*.*.*:*}
  default-super-admin:
    username: ${SUPER_ADMIN_USERNAME:super}
    password: ${SUPER_ADMIN_PASSWORD:1234a}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}

search:
  tavily:
    api-key: ${TAVILY_API_KEY:}
  serpapi:
    api-key: ${SERPAPI_API_KEY:}
  google:
    api-key: ${GOOGLE_SEARCH_API_KEY:}
    cx: ${GOOGLE_SEARCH_CX:}

logging:
  level:
    com.olima: DEBUG
    org.springframework.ai: DEBUG
